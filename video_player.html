<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Video Player-GFG</title>
    <link rel="stylesheet" type="text/css" href="css/video_player_style.css">
</head>

<body>
    <div class="gfg">
        <p>GeeksForGeeks</p>
        <p>Custom Video Player</p>
    </div>

    <div class="video-container">
        <img
            src="https://media.geeksforgeeks.org/wp-content/uploads/20231020170918/Thumbnail-(1).jpg"
            class="video-thumbnail"
            alt="Video Thumbnail">

        <video class="video">
            <source
                src="https://media.geeksforgeeks.org/wp-content/uploads/20231020155223/Full-Stack-Development-_-LIVE-Classes-_-GeeksforGeeks.mp4"
                type="video/mp4">
        </video>

        <div class="controls">
            <div class="left">
                <button class="skipminus-10">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button class="play-pause">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="skip-10">
                    <i class="fa-solid fa-forward"></i>
                </button>
            </div>

            <div class="video-timer">
                <span class="current-time">00:00</span>
                <span class="separator">/</span>
                <span class="max-duration">00:00</span>
            </div>

            <div class="playback-line">
                <div class="progress-bar"></div>
            </div>

            <div class="right">
                <div class="volume-container">
                    <div class="mute">
                        <i class="fas fa-volume-up"></i>
                    </div>
                    <input type="range"
                           class="volume"
                           min="0"
                           max="1"
                           step="0.01"
                           value="1">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
